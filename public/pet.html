<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetTag</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      font-family: 'Segoe UI', sans-serif;
    }

    /* ── Card principal ── */
    .pet-card {
      background: #fff;
      border-radius: 20px;
      padding: 2rem 1.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .pet-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── Avatar ── */
    .avatar-wrap {
      width: clamp(90px, 28vw, 130px);
      height: clamp(90px, 28vw, 130px);
      border-radius: 50%;
      margin: 0 auto 1.2rem;
      overflow: hidden;
      background: #e9ecef;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(36px, 10vw, 54px);
      border: 3px solid #1a1a2e;
    }

    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ── Nombre ── */
    .pet-name {
      font-size: clamp(1.4rem, 5vw, 1.9rem);
      font-weight: 700;
      text-align: center;
      color: #1a1a2e;
      margin-bottom: 1.5rem;
    }

    /* ── Info rows ── */
    .info-row {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      padding: 0.75rem 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .info-row:last-of-type { border-bottom: none; }

    .info-label {
      font-size: clamp(10px, 2.5vw, 12px);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #9FE1CB;
    }

    .info-value {
      font-size: clamp(0.95rem, 3.5vw, 1.05rem);
      color: #1a1a2e;
      font-weight: 500;
    }

    /* ── Botones ── */
    .btn-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    .btn-call, .btn-whatsapp {
      flex: 1;
      padding: clamp(10px, 3vw, 14px);
      border-radius: 12px;
      font-size: clamp(13px, 3.5vw, 15px);
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-call { background: #1a1a2e; color: #fff; }
    .btn-whatsapp { background: #25D366; color: #fff; }

    .btn-call:active, .btn-whatsapp:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    /* ── Skeleton loader ── */
    .skeleton {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
      border-radius: 6px;
      height: 18px;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .skeleton-avatar {
      width: clamp(90px, 28vw, 130px);
      height: clamp(90px, 28vw, 130px);
      border-radius: 50%;
      margin: 0 auto 1.2rem;
    }

    .skeleton-title { width: 60%; margin: 0 auto 1.5rem; height: 28px; }
    .skeleton-line { width: 40%; height: 12px; margin-bottom: 6px; }
    .skeleton-line.wide { width: 75%; }
  </style>
</head>

<body>

  <!-- Skeleton visible mientras carga -->
  <div class="pet-card visible" id="skeleton">
    <div class="skeleton skeleton-avatar"></div>
    <div class="skeleton skeleton-title"></div>
    <div class="skeleton skeleton-line"></div>
    <div class="skeleton skeleton-line wide"></div>
    <div class="skeleton skeleton-line" style="margin-top:12px"></div>
    <div class="skeleton skeleton-line wide"></div>
  </div>

  <!-- Card real, oculta hasta tener datos -->
  <div class="pet-card" id="petCard" style="display:none;">

    <div class="avatar-wrap">
      <img id="petPhoto" style="display:none;">
      <span id="petIcon">🐶</span>
    </div>

    <div class="pet-name" id="petName"></div>

    <div class="info-row">
      <span class="info-label">Dueño</span>
      <span class="info-value" id="ownerName"></span>
    </div>

    <div class="info-row">
      <span class="info-label">Teléfono</span>
      <span class="info-value" id="phone"></span>
    </div>

    <div class="info-row">
      <span class="info-label">Notas</span>
      <span class="info-value" id="extra"></span>
    </div>

    <div class="btn-actions">
      <button class="btn-call" id="callBtn">📞 Llamar</button>
      <button class="btn-whatsapp" id="whatsappBtn">💬 WhatsApp</button>
    </div>

  </div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script type="module" src="/js/app.js"></script>

</body>
</html>
