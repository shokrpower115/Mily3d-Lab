<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>PetScan</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f4f6f9;
    }

    .card {
      border-radius: 15px;
    }

    .pet-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #dee2e6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin: 0 auto 15px;
      object-fit: cover;
    }

    .info-label {
      font-weight: bold;
      color: #6c757d;
      font-size: 14px;
    }

    .info-value {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .actions button {
      font-size: 14px;
      padding: 8px;
    }
  </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">
  
  <div class="card p-4 shadow" style="max-width: 420px; width: 100%;">

    <!-- Avatar -->
    <img id="petPhoto" class="pet-avatar" style="display:none;">
    <div id="petIcon" class="pet-avatar">🐶</div>

    <!-- Nombre -->
    <h4 id="petName" class="text-center mb-3">Cargando...</h4>

    <!-- Info tipo formulario -->
    <div>
      <div class="info-label">Dueño</div>
      <div id="ownerName" class="info-value"></div>

      <div class="info-label">Teléfono</div>
      <div id="phone" class="info-value"></div>

      <div class="info-label">Notas</div>
      <div id="extra" class="info-value"></div>
    </div>

    <!-- Acciones -->
    <div class="d-flex gap-2 mt-3 actions">
      <button id="callBtn" class="btn btn-success w-50">📞 Llamar</button>
      <button id="whatsappBtn" class="btn btn-outline-success w-50">💬 WhatsApp</button>
    </div>

  </div>

</div>

<!-- SweetAlert -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script type="module" src="/js/app.js"></script>

</body>
</html>
