<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registrar Mascota</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">

  <div class="card p-4 shadow" style="max-width: 400px; width: 100%;">
    
    <h3 class="text-center mb-3">Registrar Mascota 🐾</h3>

    <input id="petName" class="form-control mb-2" placeholder="Nombre de la mascota">
    <input id="ownerName" class="form-control mb-2" placeholder="Nombre del dueño">
    <input id="phone" class="form-control mb-2" placeholder="Teléfono">

    <textarea id="extra" class="form-control mb-3" placeholder="Información extra (opcional)"></textarea>
    <input type="file" id="petImage" class="form-control mb-2">
    <button id="saveBtn" class="btn btn-primary w-100">
      Guardar
    </button>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script type="module" src="/js/register.js"></script>

</body>
</html>
