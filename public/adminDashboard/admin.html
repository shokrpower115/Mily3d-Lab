<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — PetTag</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <div class="admin-wrap">

    <!-- Cabecera -->
    <header class="admin-header">
      <div class="header-brand">
        <span class="brand-dot"></span>
        PetTag Admin
      </div>
      <span class="header-sub">Panel de administración</span>
    </header>

    <!-- Crear tag -->
    <section class="section-card">
      <div class="section-title">Nuevo tag NFC</div>
      <div class="crear-row">
        <div class="id-display" id="idGenerado">—</div>
        <button class="btn-generar" id="generarBtn">Generar ID</button>
        <button class="btn-guardar" id="guardarBtn" disabled>Guardar</button>
      </div>
      <div class="crear-hint">Genera un ID y presiona guardar para registrarlo en el sistema.</div>
    </section>

    <!-- Tabla de tags -->
    <section class="section-card">
      <div class="section-title">Tags registrados</div>
      <div id="tabla-wrap">
        <div class="loading-row" id="loadingMsg">Cargando tags...</div>
      </div>
    </section>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script type="module" src="admin.js"></script>
</body>
</html>
